# Builds Colony for macOS and runs the unit tests.
# Colony is an Xcode project (no Package.swift), so this uses xcodebuild rather than `swift build`.
# Code signing is off: without the iCloud entitlement the app falls back to an on-device store,
# and the tests use an in-memory store anyway.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select newest Xcode
      run: |
        XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
        sudo xcode-select -s "$XCODE"
        xcodebuild -version

    - name: Build
      run: |
        xcodebuild build -project Colony.xcodeproj -scheme Colony \
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: |
        xcodebuild test -project Colony.xcodeproj -scheme Colony \
          -destination 'platform=macOS' -only-testing:ColonyTests CODE_SIGNING_ALLOWED=NO
